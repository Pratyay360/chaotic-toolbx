name: Build and Push Containers

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - containerfile: brew
            image_name: brew-toolbox
          - containerfile: chaotic
            image_name: chaotic-toolbox
          - containerfile: android
            image_name: android-toolbox
          - containerfile: waydroid
            image_name: waydroid-toolbox

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Build image
        uses: redhat-actions/buildah-build@main
        id: build
        with:
          image: pratyay360/${{ matrix.image_name }}
          tags: |
            latest
            ${{ github.sha }}
          containerfiles: ./ContainerFiles/${{ matrix.containerfile }}
          context: .

      - name: Login to GHCR
        uses: redhat-actions/podman-login@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push to GHCR
        id: ghcr
        uses: redhat-actions/push-to-registry@main
        with:
          registry: ghcr.io
          image: pratyay360/${{ matrix.image_name }}
          tags: ${{ steps.build.outputs.tags }}

      - name: Attest GHCR image
        uses: actions/attest@main
        with:
          subject-name: ghcr.io/pratyay360/${{ matrix.image_name }}
          subject-digest: ${{ steps.ghcr.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Login to Quay
        uses: redhat-actions/podman-login@main
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push to Quay
        id: quay
        uses: redhat-actions/push-to-registry@main
        with:
          registry: quay.io
          image: pratyay360/${{ matrix.image_name }}
          tags: ${{ steps.build.outputs.tags }}

      - name: Attest Quay image
        uses: actions/attest@main
        with:
          subject-name: quay.io/pratyay360/${{ matrix.image_name }}
          subject-digest: ${{ steps.quay.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Login to Docker Hub
        uses: redhat-actions/podman-login@main
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        uses: redhat-actions/push-to-registry@main
        with:
          registry: docker.io
          image: pratyay360/${{ matrix.image_name }}
          tags: ${{ steps.build.outputs.tags }}
